<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fraud Alerts</title>
<style>
  :root {
    color-scheme: light;
    --page: #f4f3f0;
    --surface: #fcfcfb;
    --border: #e3e2de;
    --text: #0b0b0b;
    --text-2: #52514e;
    --track: #e9e8e4;
    --accent: #2a78d6;
    --chip: #efeeea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #121211;
      --surface: #1a1a19;
      --border: #2e2e2c;
      --text: #ffffff;
      --text-2: #c3c2b7;
      --track: #2e2e2c;
      --accent: #3987e5;
      --chip: #262624;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; font-weight: 650; }
  .status { color: var(--text-2); font-size: 13px; }
  .status.error { color: var(--text); font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 20px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .tile .label { color: var(--text-2); font-size: 13px; }
  .tile .value { font-size: 32px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .panel h2 { font-size: 15px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 720px; }
  th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--text-2); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .score { display: flex; align-items: center; gap: 8px; min-width: 130px; }
  .bar { flex: 1; height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .score b { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 36px; text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { background: var(--chip); color: var(--text-2); font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .empty { padding: 32px 16px; text-align: center; color: var(--text-2); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Fraud Alerts</h1>
    <span class="status" id="status">Loading…</span>
  </header>

  <section class="tiles" aria-label="Summary">
    <div class="tile"><div class="label">Transactions processed</div><div class="value" id="total">–</div></div>
    <div class="tile"><div class="label">Flagged</div><div class="value" id="flagged">–</div></div>
    <div class="tile"><div class="label">Flag rate</div><div class="value" id="rate">–</div></div>
  </section>

  <section class="panel">
    <h2>Latest flagged transactions</h2>
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>Transaction</th><th>Type</th><th class="num">Step</th>
            <th class="num">Amount</th><th>Score</th><th>Reasons</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>No flagged transactions yet.</div>
  </section>
</main>

<script>
  // The alerting service, as reached from the browser.
  const API = "http://localhost:8002";
  const REFRESH_MS = 5000;
  const ROW_LIMIT = 100;

  const $ = (id) => document.getElementById(id);
  const fmtInt = new Intl.NumberFormat("en-US");
  const fmtMoney = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function cell(text, className) {
    const td = document.createElement("td");
    if (className) td.className = className;
    td.textContent = text;
    return td;
  }

  function scoreCell(score) {
    const td = document.createElement("td");
    const wrap = document.createElement("div");
    wrap.className = "score";
    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("span");
    fill.style.width = Math.max(0, Math.min(1, score)) * 100 + "%";
    bar.appendChild(fill);
    const label = document.createElement("b");
    label.textContent = score.toFixed(2);
    wrap.append(bar, label);
    td.appendChild(wrap);
    return td;
  }

  function reasonsCell(reasons) {
    const td = document.createElement("td");
    const wrap = document.createElement("div");
    wrap.className = "chips";
    for (const reason of reasons || []) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = reason.replace(/_/g, " ");
      wrap.appendChild(chip);
    }
    td.appendChild(wrap);
    return td;
  }

  function render(stats, alerts) {
    $("total").textContent = fmtInt.format(stats.total);
    $("flagged").textContent = fmtInt.format(stats.flagged);
    $("rate").textContent = (stats.flag_rate * 100).toFixed(2) + "%";

    const rows = alerts.map((a) => {
      const tr = document.createElement("tr");
      tr.append(
        cell(a.id, "id"),
        cell(a.type || "–"),
        cell(a.step ?? "–", "num"),
        cell(fmtMoney.format(a.amount) + " " + a.currency, "num"),
        scoreCell(a.score),
        reasonsCell(a.reasons),
      );
      return tr;
    });
    $("rows").replaceChildren(...rows);
    $("empty").hidden = alerts.length > 0;
  }

  async function refresh() {
    const status = $("status");
    try {
      const [statsRes, alertsRes] = await Promise.all([
        fetch(API + "/stats"),
        fetch(API + "/alerts?limit=" + ROW_LIMIT),
      ]);
      if (!statsRes.ok || !alertsRes.ok) throw new Error("bad response");
      render(await statsRes.json(), await alertsRes.json());
      status.className = "status";
      status.textContent = "Updated " + new Date().toLocaleTimeString() + " · refreshes every " + REFRESH_MS / 1000 + "s";
    } catch (err) {
      status.className = "status error";
      status.textContent = "Can't reach the alerting service at " + API;
    }
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
